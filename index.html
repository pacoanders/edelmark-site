<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDELMARK</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}

  :root{
    --dw:clamp(340px,40vw,620px);
    --hh:clamp(72px,9vh,96px);
    --peek:clamp(64px,6.4vw,110px);
    --ease:cubic-bezier(.22,.8,.2,1);
    --ink:#111111;
    --black:#0E0E0E;
    --blue:#86d1f8;
    --blue-hover:#7bc0e4;
    --muted:#8A8A8A;
  }

  body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--black);
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= Fond : placeholder photo en dégradé gris ================= */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(60% 55% at 72% 35%,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 70%),
      radial-gradient(55% 60% at 30% 85%,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 70%),
      linear-gradient(120deg,#8c8c8c 0%,#4a4a4a 45%,#161616 100%);
  }
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:.18;
    mix-blend-mode:overlay;
  }

  /* ================= Barre noire (toujours visible) ================= */
  .topbar{
    position:fixed;
    top:0;
    left:0;
    z-index:4;
    width:var(--dw);
    height:var(--hh);
    background:var(--black);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 clamp(24px,2.6vw,40px);
  }
  .brand{
    color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:clamp(20px,2.1vw,34px);
    letter-spacing:.01em;
    line-height:1;
    text-transform:uppercase;
    white-space:nowrap;
  }

  .toggle{
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:0;
    color:#fff;
    cursor:pointer;
    font:inherit;
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:8px 4px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .ico{position:relative;display:block;width:24px;height:14px}
  .ico i{
    position:absolute;
    left:0;
    height:2px;
    background:#fff;
    transition:transform .45s var(--ease),top .45s var(--ease),bottom .45s var(--ease),width .45s var(--ease);
  }
  .ico i:first-child{top:2px;width:16px}
  .ico i:last-child{bottom:2px;width:24px}
  .drawer-open .ico i:first-child{top:6px;width:24px;transform:rotate(45deg)}
  .drawer-open .ico i:last-child{top:6px;bottom:auto;width:24px;transform:rotate(-45deg)}

  /* ================= Tiroir blanc : glisse de gauche à droite ================= */
  .drawer{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:var(--dw);
    z-index:3;
    background:#fff;
    overflow:hidden;
    transform:translateX(-101%);
    visibility:hidden;
    /* À la fermeture : les languettes rentrent d'abord, puis le tiroir sort */
    transition:transform .8s var(--ease) .45s, visibility 0s linear 1.25s;
  }
  .drawer-open .drawer{
    transform:translateX(0);
    visibility:visible;
    transition:transform .9s var(--ease) 0s, visibility 0s;
  }

  /* Vue d'accueil : titre */
  .dbody{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:calc(var(--hh) + clamp(28px,6vh,64px)) clamp(24px,2.8vw,40px) clamp(28px,4.5vh,48px);
  }
  .dbody > *{
    opacity:0;
    transform:translateY(14px);
    transition:opacity .25s ease,transform .25s ease;
  }
  .drawer-open .dbody > *{
    opacity:1;
    transform:none;
    transition:opacity .7s ease,transform .8s var(--ease);
  }
  .drawer-open .dbody > :nth-child(1){transition-delay:.45s}
  .drawer-open .dbody > :nth-child(2){transition-delay:.55s}

  .kicker{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding-bottom:14px;
    border-bottom:1px solid #e2e2e2;
  }
  .headline{
    margin:auto 0;
    font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:900;
    text-transform:uppercase;
    font-size:clamp(22px,2.5vw,44px);
    line-height:1.3;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .headline .ln{display:block;margin-bottom:.26em}
  .headline .ln:last-child{margin-bottom:0}
  .hl{
    background:var(--black);
    color:var(--blue);
    padding:.02em .14em;
    -webkit-box-decoration-break:clone;
    box-decoration-break:clone;
  }

  /* Vue d'une languette sélectionnée (ordinateur) : rectangle bleu arrondi dans le tiroir */
  .view-info{
    position:absolute;
    inset:0;
    display:none;
    padding:calc(var(--hh) + 22px) 22px 22px;
  }
  .is-info .view-info{
    display:block;
    animation:infoIn .6s var(--ease) both;
  }
  .is-info .dbody{display:none}
  @keyframes infoIn{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  .card-info{
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--blue);
    color:var(--ink);
    border-radius:28px;
    padding:clamp(22px,3vh,32px) clamp(22px,2.4vw,36px);
    overflow-y:auto;
  }
  .ci-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .ci-back{
    background:var(--black);
    color:#fff;
    border:0;
    border-radius:0;
    padding:10px 18px;
    font:inherit;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .ci-num{font-size:13px;font-weight:600;letter-spacing:.04em}
  .ci-title{
    margin-top:clamp(28px,6vh,64px);
    font-size:clamp(28px,3.1vw,50px);
    font-weight:600;
    letter-spacing:-.025em;
    line-height:1.06;
  }
  .ci-desc{
    margin-top:14px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    line-height:1.4;
    text-transform:uppercase;
  }
  .ci-body{margin-top:clamp(20px,4vh,36px)}
  .ci-body p{font-size:clamp(15px,1.15vw,17px);line-height:1.6;max-width:44ch}
  .ci-body p + p{margin-top:12px}
  .ci-body ul{list-style:none;display:grid;gap:10px;margin-top:18px}
  .ci-body li{
    padding:14px 18px;
    border-radius:16px;
    background:rgba(255,255,255,.5);
    font-size:15px;
  }

  /* Page bleue (mobile) : tirée par la languette touchée, hors écran à gauche au repos */
  .page{display:none}

  /* ================= Languettes bleues ================= */
  .tabs-desk{
    position:fixed;
    left:0;
    bottom:0;
    width:calc(var(--dw) * 2);
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:4px;
    pointer-events:none;
  }
  .tabs-mob{display:none}

  .tab{
    --x:0px;                                  /* position au repos : collée au tiroir */
    --d:calc(.95s + var(--i) * .18s);         /* délai de sortie, une par une */
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    margin:0 0 0 var(--dw);
    width:var(--dw);
    min-height:clamp(130px,19vh,210px);
    padding:clamp(16px,2.4vh,28px) clamp(22px,2.6vw,38px);
    border:0;
    border-radius:0;
    font:inherit;
    color:var(--ink);
    text-align:left;
    background:var(--blue);
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%);
    /* caché sous le tiroir tant qu'il n'est pas sorti */
    transform:translateX(calc(-1 * var(--dw) - 60px));
    visibility:hidden;
    transition:transform .5s var(--ease), visibility 0s linear .55s;
  }
  .drawer-open .tab{
    transform:translateX(var(--x));
    visibility:visible;
    transition:transform .7s var(--ease), visibility 0s;
  }
  /* Sortie une par une, uniquement à l'ouverture initiale */
  .drawer-open:not(.settled) .tab{transition-delay:var(--d)}

  /* Ordinateur : la languette sélectionnée glisse sous le tiroir et laisse dépasser
     seulement un bout avec la flèche */
  .tab.is-active{--x:calc(var(--peek) - var(--dw))}

  @media (hover:hover){
    .tab:hover{filter:brightness(.97)}
    .tab:hover .chev{transform:translate(5px,-50%)}
  }

  .prog{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
  }
  .bar{position:relative;flex:1;height:2px;background:rgba(0,0,0,.22)}
  .bar i{position:absolute;left:0;top:0;height:2px;background:var(--ink)}

  .tbody{display:block;padding-right:48px}
  .ttl{
    display:block;
    font-size:clamp(20px,min(2.4vw,4.2vh),40px);
    font-weight:500;
    line-height:1.06;
    letter-spacing:-.015em;
    color:var(--ink);
  }
  .tdesc{
    display:block;
    margin-top:clamp(8px,1.2vh,14px);
    font-size:clamp(10.5px,.8vw,12.5px);
    font-weight:500;
    letter-spacing:.02em;
    line-height:1.35;
    text-transform:uppercase;
    max-width:44ch;
  }
  .chev{
    position:absolute;
    top:50%;
    right:clamp(22px,2.6vw,38px);
    width:clamp(22px,2vw,30px);
    height:clamp(22px,2vw,30px);
    transform:translateY(-50%);
    color:var(--ink);
    transition:transform .3s var(--ease);
  }

  /* ================= Bulle de contact (ordinateur : en haut à droite) ================= */
  .cta{
    position:fixed;
    top:clamp(16px,3vh,28px);
    right:clamp(16px,2.4vw,32px);
    width:min(520px,calc(100vw - var(--dw) - 72px));
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 8px 8px 22px;
    border-radius:999px;
    background:var(--blue);
    color:var(--ink);
    z-index:5;
    opacity:0;
    visibility:hidden;
    transform:translateY(-30px) scale(.85);
    transform-origin:top right;
    pointer-events:none;
    box-shadow:0 18px 48px rgba(0,0,0,.3);
    transition:opacity .45s ease, transform .7s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .7s;
  }
  .cta.show{
    opacity:1;
    visibility:visible;
    transform:none;
    pointer-events:auto;
    transition:opacity .45s ease, transform .7s cubic-bezier(.34,1.56,.64,1), visibility 0s;
  }

  .cta h2{
    font-size:clamp(14px,1.2vw,17px);
    font-weight:700;
    letter-spacing:-.01em;
    white-space:nowrap;
  }
  .cta form{flex:1;display:flex;gap:8px;min-width:0}
  .cta input{
    flex:1;
    min-width:0;
    height:clamp(40px,4.4vh,46px);
    border:0;
    border-radius:999px;
    background:#fff;
    color:var(--ink);
    padding:0 18px;
    font:inherit;
    font-size:16px;
    outline:none;
  }
  .cta input::placeholder{color:var(--muted)}
  .cta input:focus{box-shadow:0 0 0 3px var(--ink)}
  .cta button{
    height:clamp(40px,4.4vh,46px);
    padding:0 clamp(16px,1.6vw,22px);
    border:0;
    border-radius:999px;
    background:var(--black);
    color:#fff;
    font:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .2s ease;
  }
  .cta button:hover{background:#2b2b2b}

  .msg{
    position:absolute;
    right:0;
    top:calc(100% + 10px);
    padding:7px 14px;
    border-radius:999px;
    background:var(--black);
    color:#fff;
    font-size:13px;
    white-space:nowrap;
  }
  .msg:empty{display:none}
  .msg.ok{color:var(--blue)}
  .hp{position:absolute !important;left:-9999px;width:1px;height:1px;opacity:0}
  .consent{
    position:absolute;
    left:14px;
    top:calc(100% + 10px);
    padding:5px 12px;
    border-radius:999px;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:11px;
    white-space:nowrap;
  }
  .cta:has(.msg:not(:empty)) .consent{display:none}

  /* ================= Mobile et tablette ================= */
  @media (max-width:900px), (max-height:520px){
    :root{--dw:100vw;--hh:64px}

    /* Le tiroir commence sous la barre noire : aucune languette ne passe sous elle */
    .drawer{
      top:var(--hh);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior:contain;
      touch-action:pan-y;
    }
    .dbody{
      position:static;
      display:block;
      padding:28px 24px 24px;
    }
    .is-info .dbody{display:block}
    .headline{margin:32px 0 0;font-size:clamp(24px,7vw,36px)}

    /* Liste des languettes dans le tiroir */
    .tabs-desk{display:none}
    .tabs-mob{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:28px;
      padding-bottom:220px;
    }
    .tabs-mob .tab,
    .tabs-mob .tab.is-active{
      margin-left:0;
      width:100%;
      min-height:150px;
      padding:20px 22px;
      will-change:transform;
    }
    /* La languette touchée part à droite et tire la page bleue */
    .tabs-mob .tab.is-active{--x:100%}
    .tabs-mob .ttl{font-size:22px}
    .tbody{padding-right:40px}
    .chev{right:18px}

    .view-info,
    .is-info .view-info{display:none}

    /* Page bleue de même couleur que la languette, qui sort de la gauche */
    .page{
      display:block;
      position:fixed;
      top:var(--hh);
      left:0;
      right:0;
      bottom:0;
      z-index:3;
      overflow-y:auto;
      overscroll-behavior:contain;
      touch-action:pan-y;
      background:var(--blue);
      color:var(--ink);
      padding:clamp(24px,4vh,36px) 22px 240px;
      transform:translateX(-100%);
      visibility:hidden;
      will-change:transform;
      transition:transform .7s var(--ease), visibility 0s linear .7s;
    }
    .is-info .page{
      transform:translateX(0);
      visibility:visible;
      transition:transform .7s var(--ease), visibility 0s;
    }
    .page .ci-title{font-size:clamp(28px,8vw,40px);margin-top:clamp(28px,6vh,48px)}

    /* La bulle devient une barre noire qui monte depuis le bas */
    .cta{
      top:auto;
      bottom:0;
      left:0;
      right:0;
      width:auto;
      flex-direction:column;
      align-items:stretch;
      gap:0;
      padding:18px 16px calc(18px + env(safe-area-inset-bottom));
      border-radius:24px 24px 0 0;
      background:var(--black);
      color:#fff;
      transform:translateY(105%);
      transform-origin:center bottom;
      box-shadow:0 -12px 32px rgba(0,0,0,.3);
      transition:transform .6s cubic-bezier(.2,.9,.25,1.06), visibility 0s linear .6s;
    }
    .cta.show{
      transform:none;
      transition:transform .6s cubic-bezier(.2,.9,.25,1.06), visibility 0s;
    }
    .cta h2{
      color:#fff;
      text-align:center;
      font-size:17px;
      margin-bottom:12px;
      white-space:normal;
    }
    .cta form{flex:none;gap:8px}
    .cta input{height:46px}
    .cta button{height:46px;padding:0 20px;font-size:15px;background:var(--blue);color:var(--ink)}
    .cta button:hover{background:var(--blue-hover)}
    .msg{
      position:static;
      margin-top:8px;
      padding:0;
      background:none;
      text-align:center;
      font-size:13px;
      color:#fff;
      white-space:normal;
    }
    .msg.ok{color:var(--blue)}
    .consent{position:static;margin-top:8px;padding:0;background:none;text-align:center;font-size:11px;color:rgba(255,255,255,.7);white-space:normal}
    .cta:has(.msg:not(:empty)) .consent{display:block}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>

  <!-- Barre noire -->
  <header class="topbar">
    <div class="brand">EDELMARK</div>
    <button class="toggle" id="toggle" type="button" aria-expanded="false" aria-controls="drawer">
      <span class="tlabel">Menu</span>
      <span class="ico" aria-hidden="true"><i></i><i></i></span>
    </button>
  </header>

  <!-- Tiroir blanc -->
  <aside class="drawer" id="drawer">

    <!-- Vue d'accueil -->
    <div class="dbody">
      <div class="kicker">Formation et transition vers l’IA</div>
      <h2 class="headline">
        <span class="ln">L’intelligence artificielle vous permet de</span>
        <span class="ln"><span class="hl">produire plus, de manière plus efficace et pour moins cher.</span></span>
        <span class="ln">Formez-vous et commencez la transition.</span>
      </h2>
    </div>

    <!-- Vue d'une languette sélectionnée (ordinateur) -->
    <div class="view-info" id="viewInfo">
      <div class="card-info" id="cardInfo">
        <div class="ci-top">
          <button class="ci-back" type="button">← Retour</button>
          <span class="ci-num" data-f="num"></span>
        </div>
        <h3 class="ci-title" data-f="title"></h3>
        <p class="ci-desc" data-f="desc"></p>
        <div class="ci-body" data-f="body"></div>
      </div>
    </div>

    <!-- Languettes (version mobile, dans le tiroir) -->
    <div class="tabs-mob" id="tabsMob"></div>
  </aside>

  <!-- Page bleue (mobile), tirée par la languette touchée -->
  <section class="page" id="page" aria-label="Contenu de la languette">
    <div class="ci-top">
      <button class="ci-back" type="button">← Retour</button>
      <span class="ci-num" data-f="num"></span>
    </div>
    <h3 class="ci-title" data-f="title"></h3>
    <p class="ci-desc" data-f="desc"></p>
    <div class="ci-body" data-f="body"></div>
  </section>

  <!-- Languettes (version ordinateur, collées au tiroir) -->
  <div class="tabs-desk" id="tabsDesk"></div>

  <!-- Bulle de contact -->
  <section class="cta" id="cta">
    <h2>Je vous contacte.</h2>
    <form id="ctaForm" novalidate>
      <input id="contact" type="text" placeholder="Numéro, Email" autocomplete="off" aria-label="Numéro, Email">
      <input type="text" name="website" id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Envoyer</button>
    </form>
    <p class="consent">En envoyant, vous acceptez d'être recontacté par EdelMark.</p>
    <p class="msg" id="msg" role="status"></p>
  </section>

<script>
  /* ----- Contenu des languettes (modifiez les textes ici) ----- */
  const ITEMS = [
    {
      title:"Formation en entreprise",
      desc:"Formation sur site ou à distance.",
      body:`<p>Nous formons vos équipes à utiliser correctement l'intelligence artificielle. Nos principaux objectifs résident sur 3 points :</p>
            <ul>
              <li>1) Aider votre équipe à améliorer sa productivité et son confort de travail</li>
              <li>2) Démystifier l'intelligence artificielle</li>
              <li>3) Vous former aux pratiques d'optimisation</li>
            </ul>`
    },
    {
      title:"Conseil et produits IA",
      desc:"Les bons produits IA, avec un plan clair et un budget maîtrisé.",
      body:`<p>Nous effectuons un audit afin de vous conseiller de manière neutre sur les améliorations possibles au sein de votre entreprise et de construire des ressources uniques à votre métier.</p>
            <p>Tout projet potentiel est orchestré directement via nos conseils.</p>`
    },
    {
      title:"À propos",
      desc:"Comment nous travaillons avec vous, du premier échange au résultat.",
      body:`<p>Nous sommes une équipe d'informaticiens indépendants. Après avoir travaillé des années dans l'industrie pour des sociétés internationales, nous profitons de notre savoir-faire et de nos contacts pour participer à la transition vers l'intelligence artificielle. Trop peu et mal utilisée aujourd'hui.</p>
            <p>Si vous avez des questions, laissez-nous une adresse e-mail ou un numéro et nous vous contacterons.</p>`
    }
  ];

  const byId     = id => document.getElementById(id);
  const pad      = n => String(n).padStart(2, "0");
  const body     = document.body;
  const drawer   = byId("drawer");
  const pageEl   = byId("page");
  const cardInfo = byId("cardInfo");
  const toggle   = byId("toggle");
  const tlabel   = toggle.querySelector(".tlabel");

  let activeIndex = null;
  let settleTimer = null;

  /* ----- Génération des languettes (une version ordinateur, une version mobile) ----- */
  function tabHTML(it, i){
    const pct = Math.round((i + 1) / ITEMS.length * 100);
    return `
      <button class="tab" type="button" data-index="${i}" style="--i:${i}">
        <span class="prog">
          <span>${pad(i + 1)}</span>
          <span class="bar"><i style="width:${pct}%"></i></span>
          <span>${pad(ITEMS.length)}</span>
        </span>
        <span class="tbody">
          <span class="ttl">${it.title}</span>
          <span class="tdesc">${it.desc}</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
      </button>`;
  }
  byId("tabsDesk").innerHTML = ITEMS.map((it, i) => tabHTML(it, i)).join("");
  byId("tabsMob").innerHTML  = ITEMS.map((it, i) => tabHTML(it, i)).join("");

  /* ----- Remplissage du contenu (vue ordinateur et page mobile) ----- */
  function fillInfo(i){
    const it = ITEMS[i];
    const set = (name, fn) => document.querySelectorAll(`[data-f="${name}"]`).forEach(fn);
    set("num",   el => el.textContent = `${pad(i + 1)} / ${pad(ITEMS.length)}`);
    set("title", el => el.textContent = it.title);
    set("desc",  el => el.textContent = it.desc);
    set("body",  el => el.innerHTML   = it.body);
  }

  /* ----- Sélection ----- */
  function markActive(i){
    document.querySelectorAll(".tab").forEach(t => {
      t.classList.toggle("is-active", i !== null && Number(t.dataset.index) === i);
    });
  }

  /* Après un clic, l'entrée échelonnée n'est plus utilisée : les animations démarrent tout de suite */
  function settle(){
    clearTimeout(settleTimer);
    body.classList.add("settled");
  }

  function select(i){
    activeIndex = i;
    markActive(i);
    fillInfo(i);
    cardInfo.scrollTop = 0;
    pageEl.scrollTop = 0;
    settle();
    body.classList.add("is-info");
    /* Important : on ne remet PAS le défilement du tiroir à zéro,
       sinon la liste saute et les animations se déforment */
  }

  function deselect(){
    activeIndex = null;
    markActive(null);
    body.classList.remove("is-info");
  }

  /* ----- Tiroir : s'ouvre automatiquement, se ferme avec Menu / Fermer ----- */
  function setDrawer(open){
    body.classList.toggle("drawer-open", open);
    toggle.setAttribute("aria-expanded", String(open));
    tlabel.textContent = open ? "Fermer" : "Menu";

    clearTimeout(settleTimer);
    body.classList.remove("settled");
    if(open){
      settleTimer = setTimeout(() => body.classList.add("settled"), 2600);
    }else{
      deselect();
    }
  }

  toggle.addEventListener("click", () => setDrawer(!body.classList.contains("drawer-open")));
  setTimeout(() => setDrawer(true), 400);

  /* Sécurité : empêche tout décalage horizontal du tiroir */
  drawer.addEventListener("scroll", () => {
    if(drawer.scrollLeft !== 0) drawer.scrollLeft = 0;
  }, {passive:true});

  /* ----- Clics : languette (sélection / retour), boutons Retour ----- */
  document.addEventListener("click", e => {
    const t = e.target.closest(".tab");
    if(t){
      const i = Number(t.dataset.index);
      if(activeIndex === i) deselect();
      else select(i);
      return;
    }
    if(e.target.closest(".ci-back")) deselect();
  });

  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    if(activeIndex !== null) deselect();
    else if(body.classList.contains("drawer-open")) setDrawer(false);
  });

  /* ----- Bulle de contact : apparaît après 5 secondes ----- */
  const cta = byId("cta");
  setTimeout(() => cta.classList.add("show"), 5000);

  /* ----- Formulaire ----- */
  const form  = byId("ctaForm");
  const input = byId("contact");
  const msg   = byId("msg");

  const ENDPOINT = "https://edelmark-contact.pacoanders.workers.dev/contact";
  const btn = form.querySelector("button");

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const v = input.value.trim();
    const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    const isPhone = /^\+?[\d\s().-]+$/.test(v) && v.replace(/\D/g, "").length >= 8;

    if(!isEmail && !isPhone){
      msg.className = "msg err";
      msg.textContent = "Numéro ou email non valide.";
      return;
    }
    btn.disabled = true;
    msg.className = "msg";
    msg.textContent = "Envoi…";
    try{
      const r = await fetch(ENDPOINT, {
        method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({contact:v, website:byId("website").value, page:location.href})
      });
      const d = await r.json().catch(() => ({}));
      if(!r.ok || !d.ok) throw new Error(d.error || r.status);
      msg.className = "msg ok";
      msg.textContent = "Merci !";
      form.reset();
    }catch(err){
      msg.className = "msg err";
      msg.textContent = String(err.message) === "rate_limited"
        ? "Trop d'envois, réessayez dans quelques minutes."
        : "Envoi impossible. Écrivez-nous à contact@edelmark.ch.";
    }finally{
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
